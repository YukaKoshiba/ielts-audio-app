<!doctype html>
<!--
  Home screen: today's word count, progress stats, and the four study
  mode entry points. Each mode now lives on its own page (learn.html,
  review.html, quiz.html, audio.html) instead of being a hidden
  <section> toggled by JS, so every mode has its own URL and a much
  smaller script to load.
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f4ef">
<title>IELTS Vocabulary — Day 1</title>
<link rel="stylesheet" href="css/tailwind.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <div class="app-logo">IELTS Vocabulary</div>
    <div id="dayBadge" class="app-day-badge">DAY 1 · 1781–1790</div>
  </header>

  <section class="hero">
    <h1>今日は10語。</h1>
    <p>「見る」だけではなく、<b>思い出す時間</b>を入れて覚えるDay 1プロトタイプです。</p>
  </section>

  <div class="stat-row">
    <div class="stat-tile"><b id="learnedCount">0</b><small>◎ 定着</small></div>
    <div class="stat-tile"><b id="reviewCount">10</b><small>今日の10語</small></div>
    <div class="stat-tile"><b id="scoreCount">0</b><small>クイズ正解</small></div>
  </div>

  <nav class="menu-grid">
    <a class="menu-btn" href="learn.html"><strong>📖 覚える</strong><span>英単語・意味・例文を確認</span></a>
    <a class="menu-btn" href="review.html"><strong>🔁 復習</strong><span>Recall → Answer → ◎△×</span></a>
    <a class="menu-btn" href="audio.html"><strong>🎧 音声学習</strong><span>画面を見ずに10語を自動再生</span></a>
    <a class="menu-btn" href="quiz.html"><strong>✏️ クイズ</strong><span>英→日 / 日→英</span></a>
  </nav>

  <p class="notice">音声は提供された 1781–1800 の音声から、Day 1の10語分を切り出しています。日本語音声はiPhone/iPadの音声読み上げを使用します。</p>
</div>

<script type="module" src="js/home.js"></script>
</body>
</html>
